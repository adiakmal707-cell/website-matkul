<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lupa Kata Sandi</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #07152f;

            color: white;
        }

        .card {
            width: 360px;

            padding: 30px;

            background: rgba(255, 255, 255, 0.10);

            border-radius: 18px;

            text-align: center;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        p {
            color: #cbd5e1;
            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 12px;

            margin: 15px 0;

            border: none;

            border-radius: 8px;

            outline: none;

            font-size: 14px;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #4169e1;

            color: white;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;
        }

        button:hover {
            background: #3157c7;
        }

        .pesan {
            margin-top: 15px;

            color: #8ab4ff;

            font-size: 14px;
        }

        .kembali {
            display: block;

            margin-top: 20px;

            color: #8ab4ff;

            text-decoration: none;

            font-size: 14px;
        }

        .kembali:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="card">

        <h2>🔐 Lupa Kata Sandi?</h2>

        <p>
            Masukkan username kamu untuk memeriksa akun.
        </p>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Masukkan username"
                required
            >

            <button type="submit">
                Periksa Username
            </button>

        </form>

        {% if pesan %}

            <div class="pesan">
                {{ pesan }}
            </div>

        {% endif %}

        <a
            href="{{ url_for('login') }}"
            class="kembali"
        >
            ← Kembali ke Login
        </a>

    </div>

</body>

</html>
